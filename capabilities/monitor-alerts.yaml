    resources:
    - name: api-v2-alerts
      path: /api/v2/alerts
      operations:
      - name: listalerts
        method: GET
        description: List Alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of alerts to return
        - name: offset
          in: query
          type: integer
          description: Offset for pagination
      - name: createalert
        method: POST
        description: Create Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-alerts-alertId
      path: /api/v2/alerts/{alertId}
      operations:
      - name: getalert
        method: GET
        description: Get Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatealert
        method: PUT
        description: Update Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletealert
        method: DELETE
        description: Delete Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SYSDIG_API_KEY}}'
  exposes:
  - type: rest
    namespace: monitor-alerts-rest
    port: 8080
    description: REST adapter for Sysdig Monitor API — Alerts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/alerts
      name: api-v2-alerts
      description: REST surface for api-v2-alerts.
      operations:
      - method: GET
        name: listalerts
        description: List Alerts
        call: monitor-alerts.listalerts
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createalert
        description: Create Alert
        call: monitor-alerts.createalert
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/alerts/{alertid}
      name: api-v2-alerts-alertid
      description: REST surface for api-v2-alerts-alertId.
      operations:
      - method: GET
        name: getalert
        description: Get Alert
        call: monitor-alerts.getalert
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatealert
