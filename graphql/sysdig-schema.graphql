  SCTP
}

type NetworkPolicyPeer {
  podSelector: LabelSelector
  namespaceSelector: LabelSelector
  ipBlock: IPBlock
}

type IPBlock {
  cidr: String!
  except: [String!]
}

enum NetworkPolicyStatus {
  APPLIED
  PENDING
  FAILED
  DRAFT
}

type NetworkTopology {
  nodes: [NetworkNode!]!
  edges: [NetworkEdge!]!
  generatedAt: DateTime!
}

type NetworkNode {
  id: ID!
  name: String!
  namespace: String
  cluster: String!
  type: NetworkNodeType!
  labels: JSON
}

enum NetworkNodeType {
  POD
  DEPLOYMENT
  SERVICE
  NAMESPACE
  EXTERNAL
}

type NetworkEdge {
  sourceId: ID!
  destinationId: ID!
  protocol: NetworkProtocol!
  port: Int
  allowed: Boolean!
  observedAt: DateTime
}

type NetworkPolicyConnection {
  nodes: [NetworkPolicy!]!
  pageInfo: PageInfo!
}

input NetworkPolicyFilter {
  namespace: String
  cluster: String
  type: NetworkPolicyType
  status: NetworkPolicyStatus
}

input NetworkTopologyFilter {
  namespace: String
  cluster: String
  from: DateTime
  to: DateTime
}

# ─── Drift Detection ──────────────────────────────────────────────────────────

type DriftEvent {
  id: ID!
  timestamp: DateTime!
  containerId: String!
  containerName: String
  imageId: String!
  podName: String
  namespace: String
  cluster: String
  filePath: String!
  fileHash: String
  changeType: DriftChangeType!
  severity: SeverityLevel!
  policyId: ID
  policy: RuntimePolicy
  suppressed: Boolean!
}

enum DriftChangeType {
  FILE_ADDED
  FILE_MODIFIED
  FILE_DELETED
  EXECUTABLE_ADDED
  LIBRARY_ADDED
}

type DriftEventConnection {
  nodes: [DriftEvent!]!
  pageInfo: PageInfo!
}

input DriftEventFilter {
  containerId: String
  namespace: String
  cluster: String
  changeType: DriftChangeType
  severity: SeverityLevel
  suppressed: Boolean
  from: DateTime
  to: DateTime
}

