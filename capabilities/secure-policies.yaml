    resources:
    - name: api-policies-v2
      path: /api/policies/v2
      operations:
      - name: listpolicies
        method: GET
        description: List Policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter by policy type
        - name: limit
          in: query
          type: integer
      - name: createpolicy
        method: POST
        description: Create Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-policies-v2-policyId
      path: /api/policies/v2/{policyId}
      operations:
      - name: getpolicy
        method: GET
        description: Get Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatepolicy
        method: PUT
        description: Update Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletepolicy
        method: DELETE
        description: Delete Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SYSDIG_API_KEY}}'
  exposes:
  - type: rest
    namespace: secure-policies-rest
    port: 8080
    description: REST adapter for Sysdig Secure API — Policies. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/policies/v2
      name: api-policies-v2
      description: REST surface for api-policies-v2.
      operations:
      - method: GET
        name: listpolicies
        description: List Policies
        call: secure-policies.listpolicies
        with:
          type: rest.type
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpolicy
        description: Create Policy
        call: secure-policies.createpolicy
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/policies/v2/{policyid}
      name: api-policies-v2-policyid
      description: REST surface for api-policies-v2-policyId.
      operations:
      - method: GET
        name: getpolicy
        description: Get Policy
        call: secure-policies.getpolicy
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatepolicy
        description: Update Policy
        call: secure-policies.updatepolicy
