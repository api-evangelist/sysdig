aid: sysdig
name: Sysdig
description: Sysdig is a cloud and container security platform that provides runtime
  threat detection, vulnerability management, cloud security posture management (CSPM),
  compliance automation, and observability for containers, Kubernetes, and cloud environments.
  Sysdig Monitor offers full-stack monitoring and alerting while Sysdig Secure delivers
  runtime security, vulnerability scanning, policy enforcement, incident response,
  and compliance reporting.
