"""
Sysdig GraphQL Schema
Derived from the Sysdig REST API covering cloud-native security and observability:
runtime threat detection, compliance posture management, vulnerability management,
image scanning, network security policies, and drift detection.
Endpoint: No native GraphQL endpoint — conceptual schema derived from Sysdig REST API
Docs: https://docs.sysdig.com/en/developer-tools/sysdig-api/
"""

schema {
  query: Query
  mutation: Mutation
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  # Alerts
  alert(id: ID!): Alert
  alerts(filter: AlertFilter, page: PageInput): AlertConnection

  # Dashboards
  dashboard(id: ID!): Dashboard
  dashboards(filter: DashboardFilter, page: PageInput): DashboardConnection

  # Events
  event(id: ID!): Event
  events(filter: EventFilter, page: PageInput): EventConnection

  # Metrics
  metric(id: ID!): Metric
  metrics(filter: MetricFilter, page: PageInput): MetricConnection
  metricDescriptor(metricName: String!): MetricDescriptor

  # Teams
  team(id: ID!): Team
  teams(page: PageInput): TeamConnection
  currentTeam: Team

  # Notification Channels
  notificationChannel(id: ID!): NotificationChannel
  notificationChannels(page: PageInput): NotificationChannelConnection

  # Vulnerabilities
  vulnerability(id: ID!): Vulnerability
  vulnerabilities(filter: VulnerabilityFilter, page: PageInput): VulnerabilityConnection

  # Images / Scanning
  scannedImage(id: ID!): ScannedImage
  scannedImages(filter: ScannedImageFilter, page: PageInput): ScannedImageConnection
  imageScanResult(id: ID!): ImageScanResult
  imageScanResults(filter: ScanResultFilter, page: PageInput): ImageScanResultConnection

  # SBOM
  sbom(imageId: ID!): SBOM

  # Runtime Policies
  runtimePolicy(id: ID!): RuntimePolicy
  runtimePolicies(filter: PolicyFilter, page: PageInput): RuntimePolicyConnection

  # Falco Rules
  falcoRule(id: ID!): FalcoRule
  falcoRules(filter: FalcoRuleFilter, page: PageInput): FalcoRuleConnection

  # Compliance
  complianceTask(id: ID!): ComplianceTask
  complianceTasks(filter: ComplianceTaskFilter, page: PageInput): ComplianceTaskConnection
  complianceResult(taskId: ID!): ComplianceResult
  complianceFrameworks: [ComplianceFramework!]!

  # CSPM / Cloud Security Posture
  cloudAccount(id: ID!): CloudAccount
  cloudAccounts(filter: CloudAccountFilter, page: PageInput): CloudAccountConnection
  postureFindings(filter: PostureFindingFilter, page: PageInput): PostureFindingConnection

  # Activity Audit
  activityAuditEvents(filter: ActivityAuditFilter, page: PageInput): ActivityAuditEventConnection

  # Network Security
  networkPolicy(id: ID!): NetworkPolicy
  networkPolicies(filter: NetworkPolicyFilter, page: PageInput): NetworkPolicyConnection
  networkTopology(filter: NetworkTopologyFilter): NetworkTopology

  # Drift Detection
  driftEvent(id: ID!): DriftEvent
  driftEvents(filter: DriftEventFilter, page: PageInput): DriftEventConnection

  # Users
  user(id: ID!): User
  users(page: PageInput): UserConnection
  currentUser: User
}

type Mutation {
  # Alerts
  createAlert(input: CreateAlertInput!): Alert!
  updateAlert(id: ID!, input: UpdateAlertInput!): Alert!
  deleteAlert(id: ID!): DeleteResult!
  enableAlert(id: ID!): Alert!
  disableAlert(id: ID!): Alert!

  # Dashboards
  createDashboard(input: CreateDashboardInput!): Dashboard!
  updateDashboard(id: ID!, input: UpdateDashboardInput!): Dashboard!
  deleteDashboard(id: ID!): DeleteResult!
  cloneDashboard(id: ID!, name: String!): Dashboard!

  # Events
  createEvent(input: CreateEventInput!): Event!

  # Notification Channels
  createNotificationChannel(input: CreateNotificationChannelInput!): NotificationChannel!
  updateNotificationChannel(id: ID!, input: UpdateNotificationChannelInput!): NotificationChannel!
  deleteNotificationChannel(id: ID!): DeleteResult!

  # Teams
  createTeam(input: CreateTeamInput!): Team!
  updateTeam(id: ID!, input: UpdateTeamInput!): Team!
  deleteTeam(id: ID!): DeleteResult!

  # Image Scanning
  triggerImageScan(input: TriggerImageScanInput!): ImageScanJob!

  # Runtime Policies
  createRuntimePolicy(input: CreateRuntimePolicyInput!): RuntimePolicy!
  updateRuntimePolicy(id: ID!, input: UpdateRuntimePolicyInput!): RuntimePolicy!
  deleteRuntimePolicy(id: ID!): DeleteResult!
  enableRuntimePolicy(id: ID!): RuntimePolicy!
  disableRuntimePolicy(id: ID!): RuntimePolicy!

  # Falco Rules
  createFalcoRule(input: CreateFalcoRuleInput!): FalcoRule!
  updateFalcoRule(id: ID!, input: UpdateFalcoRuleInput!): FalcoRule!
  deleteFalcoRule(id: ID!): DeleteResult!

  # Users
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): DeleteResult!
}

# ─── Pagination ───────────────────────────────────────────────────────────────

input PageInput {
  limit: Int
  offset: Int
  cursor: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  total: Int
}

# ─── Common Types ─────────────────────────────────────────────────────────────

type DeleteResult {
  success: Boolean!
  id: ID!
}

scalar DateTime
scalar JSON

enum SeverityLevel {
  CRITICAL
  HIGH
  MEDIUM
  LOW
  INFO
  NONE
}

enum SortOrder {
  ASC
  DESC
}

# ─── Alerts ───────────────────────────────────────────────────────────────────

type Alert {
  id: ID!
  name: String!
  description: String
  enabled: Boolean!
  severity: SeverityLevel!
  type: AlertType!
  condition: AlertCondition!
  notificationChannels: [NotificationChannel!]!
  teamId: ID
  team: Team
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int!
}

enum AlertType {
  METRIC
  EVENT
  ANOMALY
  DOWNTIME
  PROMETHEUS
  CHANGE
  GROUP_OUTLIER
}

type AlertCondition {
  metric: String
  threshold: Float
  operator: ThresholdOperator
  timeAggregation: TimeAggregation
  groupAggregation: String
  segmentConditions: [SegmentCondition!]
}

enum ThresholdOperator {
  GT
  GTE
  LT
  LTE
  EQ
  NEQ
}

enum TimeAggregation {
  AVG
  SUM
  MIN
  MAX
  COUNT
  RATE
  NONE
}

type SegmentCondition {
  label: String!
  operator: String!
  values: [String!]!
}

type AlertConnection {
  nodes: [Alert!]!
  pageInfo: PageInfo!
}

input AlertFilter {
  enabled: Boolean
  severity: SeverityLevel
  type: AlertType
  teamId: ID
  search: String
}

input CreateAlertInput {
  name: String!
  description: String
  severity: SeverityLevel!
  type: AlertType!
  condition: AlertConditionInput!
  notificationChannelIds: [ID!]
  teamId: ID
  enabled: Boolean
}

input UpdateAlertInput {
  name: String
  description: String
  severity: SeverityLevel
  condition: AlertConditionInput
  notificationChannelIds: [ID!]
  enabled: Boolean
}

input AlertConditionInput {
  metric: String
  threshold: Float
  operator: ThresholdOperator
  timeAggregation: TimeAggregation
  groupAggregation: String
}

