      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: secure-policies.getpolicy
      outputParameters:
      - type: object
        mapping: $.
    - name: update-policy
      description: Update Policy
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: secure-policies.updatepolicy
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-policy
