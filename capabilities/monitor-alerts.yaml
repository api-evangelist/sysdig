naftiko: 1.0.0-alpha2
info:
  label: Sysdig Monitor API — Alerts
  description: 'Sysdig Monitor API — Alerts. 5 operations. Lead operation: List Alerts. Self-contained Naftiko capability
    covering one Sysdig business surface.'
  tags:
  - Sysdig
  - Alerts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
