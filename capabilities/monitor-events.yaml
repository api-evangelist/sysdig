naftiko: 1.0.0-alpha2
info:
  label: Sysdig Monitor API — Events
  description: 'Sysdig Monitor API — Events. 2 operations. Lead operation: List Events. Self-contained Naftiko capability
    covering one Sysdig business surface.'
  tags:
  - Sysdig
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SYSDIG_API_KEY: SYSDIG_API_KEY
capability:
  consumes:
  - type: http
    namespace: monitor-events
    baseUri: https://api.us1.sysdig.com
    description: Sysdig Monitor API — Events business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-events
      path: /api/v2/events
      operations:
      - name: listevents
        method: GET
        description: List Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          description: Start time in Unix epoch microseconds
        - name: to
          in: query
          type: integer
          description: End time in Unix epoch microseconds
        - name: limit
          in: query
          type: integer
          description: Maximum number of events to return
      - name: createevent
        method: POST
        description: Create Event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SYSDIG_API_KEY}}'
  exposes:
  - type: rest
    namespace: monitor-events-rest
    port: 8080
    description: REST adapter for Sysdig Monitor API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/events
      name: api-v2-events
      description: REST surface for api-v2-events.
      operations:
      - method: GET
        name: listevents
        description: List Events
        call: monitor-events.listevents
        with:
          from: rest.from
          to: rest.to
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createevent
        description: Create Event
        call: monitor-events.createevent
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: monitor-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sysdig Monitor API — Events. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-events
      description: List Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: monitor-events.listevents
      with:
        from: tools.from
        to: tools.to
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-event
      description: Create Event
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: monitor-events.createevent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
